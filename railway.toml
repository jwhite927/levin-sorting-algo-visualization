# Railway deployment configuration
# Single service: FastAPI serves both the API and the compiled Vite frontend.
# Add a Redis plugin in the Railway dashboard — it auto-sets REDIS_URL.

[build]
  dockerfilePath = "api/Dockerfile"

[deploy]
  # startCommand is intentionally omitted — the Dockerfile CMD handles $PORT via:
  #   CMD ["sh", "-c", "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"]
  # Railway's startCommand bypasses shell interpolation, so $PORT would be passed
  # literally to uvicorn. The sh -c form in the Dockerfile expands it correctly.
  healthcheckPath = "/health"
  healthcheckTimeout = 30
